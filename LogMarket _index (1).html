<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LogMarket - Login</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="login-box">


<h1>🔐 LogMarket</h1>

<p>Login to your account</p>


<form id="loginForm">


<input
type="email"
id="email"
placeholder="Email"
required>


<input
type="password"
id="password"
placeholder="Password"
required>


<button type="submit">
Login
</button>


</form>


<p>
Don't have an account?
</p>


<button onclick="location.href='register.html'">
Create Account
</button>

<button onclick="location.href='admin.html'">
    🛠 Admin Panel
</button>

</div>

<script src="js/config.js"></script>
<script src="js/login.js"></script>


</body>

</html>
