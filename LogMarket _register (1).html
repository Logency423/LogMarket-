<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LogMarket - Register</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="login-box">


<h1>🛒 LogMarket</h1>

<p>Create your account</p>


<form id="registerForm">


<input
type="text"
id="name"
placeholder="Full Name"
required>


<input
type="email"
id="email"
placeholder="Email"
required>


<input
type="password"
id="password"
placeholder="Password"
required>


<button type="submit">
Register
</button>


</form>


<p>
Already have an account?
</p>


<button onclick="location.href='index.html'">
Login
</button>


</div>


<script src="js/register.js"></script>


</body>

</html>
