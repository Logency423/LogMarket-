<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogMarket Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-box">

<h1>🛠 Admin Dashboard</h1>

<form id="productForm">

<input
type="text"
id="name"
placeholder="Product Name"
required>

<input
type="number"
id="price"
placeholder="Price"
required>

<input
type="text"
id="category"
placeholder="Category"
required>

<textarea
id="description"
placeholder="Description"
required></textarea>

<input
type="number"
id="stock"
placeholder="Stock"
required>

<input
type="number"
id="rating"
min="1"
max="5"
placeholder="Rating"
required>

<label>
📷 Product Image
</label>

<input 
type="file" 
id="image"
accept="image/*">

<button type="submit">
➕ Add Product
</button>

</form>

<hr>

<h2>Products</h2>

<div id="products"></div>

</div>

<script src="js/admin.js"></script>

</body>
</html>
